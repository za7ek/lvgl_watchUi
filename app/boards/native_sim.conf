# native_sim (SDL) board configuration
#
# Mirrors the Xiao BLE nRF52840 memory + display configuration so the
# simulation accurately reflects real-hardware resource constraints.
# Differences: SDL display driver, host-native timing, no linker-enforced
# RAM/Flash limits.

CONFIG_LVGL=y
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_Z_FLUSH_THREAD_PRIORITY=0

# SDL display + 16 bpp (matches GC9A01)
CONFIG_SDL_DISPLAY=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_CONF_MINIMAL=y

# Same minimal widget set as real hardware
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_THEME_DEFAULT=y
CONFIG_LV_FONT_MONTSERRAT_8=y
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y

# Memory sizing — 16 KB, same as xiao_ble target.
# With custom-drawn segment34 (1 obj instead of 70), 16 KB is ample.
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_DOUBLE_VDB=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4

# Kernel sizing — same as xiao_ble target
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

CONFIG_SEGMENT34_SHOW_LUNAR=y
