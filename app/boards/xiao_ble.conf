# Board-specific config for Seeed XIAO BLE nRF52840
# nRF52840: 1024 KB Flash / 256 KB RAM

# Display driver for GC9A01 round 240x240 LCD via SPI
CONFIG_DISPLAY=y
CONFIG_GC9A01=y
CONFIG_SPI=y

# Use the dedicated SPI flash for littlefs / settings
# (leave CONFIG_SPI=y already set above

# GPIO for display control pins
CONFIG_GPIO=y

# Serial console (USB CDC ACM on Xiao BLE)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="LVGL Watch"
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_DEVICE_COUNT=1

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y

# LVGL on nRF52840 is RAM-constrained; tighten sizing already in prj.conf.
# Board-specific tuning:
#  - Double VDB stays (23KB total for 240x240 @ 16bpp @ 10%
#  - Flush on work queue runs in main loop rather than a separate thread
#    (saves a thread stack, and flush thread overhead)
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_DOUBLE_VBUF=y
# CONFIG_LV_Z_FLUSH_THREAD is not set

# Power management (low-power watch use)
CONFIG_PM=y

# Low-frequency clock source for nRF52
CONFIG_CLOCK_CONTROL_NRF=y
