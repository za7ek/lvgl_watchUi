# Board-specific config for Seeed XIAO BLE nRF52840
# nRF52840: 1024 KB Flash / 256 KB RAM

# Display driver for GC9A01 round 240x240 LCD via SPI
CONFIG_DISPLAY=y
CONFIG_GC9X01X=y   # 驱动开关名，配合 galaxycore,gc9x01x 绑定
CONFIG_SPI=y
CONFIG_MIPI_DBI=y

# Use the dedicated SPI flash for littlefs / settings
# (leave CONFIG_SPI=y already set above

# GPIO for display control pins
CONFIG_GPIO=y

# Serial console.
# 这里原来还开了一整套 USB Device + CDC ACM（约 20 KB Flash），但控制台走的是
# CONFIG_UART_CONSOLE（板级 dtsi 把 uart0 设为 zephyr,console），USB 那一套
# 没有任何东西用到；而且 USB_DEVICE_STACK / USB_DEVICE_DRIVER 在 Zephyr 4.4
# 已标记 deprecated，CONFIG_USB_CDC_ACM_DEVICE_COUNT 这个符号更是已经不存在
# （会直接报 Kconfig 警告导致构建中止）。需要 USB 串口时请改用新的 USB device
# next 栈（CONFIG_USB_DEVICE_STACK_NEXT）。
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y

# LVGL on nRF52840 is RAM-constrained; tighten sizing already in prj.conf.
# Board-specific tuning:
#  - VDB = 10% of 240x240 @ 16bpp = 11.5 KB per buffer, 双缓冲共 23 KB
#  - Flush 在主循环里做，不额外起线程（省一个线程栈）
# 注意：这里原来写的是 CONFIG_LV_Z_DOUBLE_VBUF，Kconfig 里并没有这个符号
# （正确的是 LV_Z_DOUBLE_VDB），等于一行空配置。
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_DOUBLE_VDB=y
# CONFIG_LV_Z_FLUSH_THREAD is not set

# Power management
# 暂不开启 CONFIG_PM：应用里没有任何设备做 PM 状态管理，开着只会引入 idle
# 时的电源状态切换逻辑，还会触发 Kconfig 告警。真正做低功耗时再连同
# 显示背光/SPI 的 runtime PM 一起加。
# CONFIG_PM=y

# Low-frequency clock source for nRF52
CONFIG_CLOCK_CONTROL_NRF=y
