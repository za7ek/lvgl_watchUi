CONFIG_CONSOLE=y
CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CLOCK_CONTROL=y

# ============================================================================
# LVGL configuration - optimized for nRF52840 (1 MB Flash / 256 KB RAM)
#
# Strategy: start from LV_CONF_MINIMAL (everything off) and enable only what
# the watchface actually uses. This trims ~100+ KB of Flash vs. the default
# "everything on" LVGL build.
# ============================================================================
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_CONF_MINIMAL=y

# --- Core features (required by the watchface) ---
# LV_CONF_MINIMAL defaults the string encoding to ASCII, which makes LVGL treat
# each byte of a UTF-8 sequence as its own codepoint — every Chinese character
# then renders as 3 placeholder boxes. UTF-8 is required for the CJK rows.
CONFIG_LV_TXT_ENC_UTF8=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_THEME_DEFAULT=y
CONFIG_LV_FONT_MONTSERRAT_8=y
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y

# --- Widgets: only label + bar + image (everything base obj provides is always on) ---
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_IMAGE=y

# --- Memory: increased for complex UI with many LVGL objects ---
# With 12 fields × 2 labels + clock + icons = 30+ objects
# Need ~24KB for objects + styles + timers
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_MEM_SIZE_KILOBYTES=128

# --- Rendering / VDB (10% of screen = ~11.5 KB per buffer) ---
CONFIG_LV_USE_DRAW_SW=y
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_DOUBLE_VDB=y

# --- Logging / asserts (off for release build to save flash) ---
# CONFIG_LV_USE_LOG is not set
# CONFIG_LV_USE_ASSERT_NULL is not set
# CONFIG_LV_USE_ASSERT_MALLOC is not set

# ============================================================================
# Zephyr kernel / system sizing (conservative for nRF52840)
# ============================================================================
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=65536

# ============================================================================
# Hardware / sensors (stub for now)
# ============================================================================
CONFIG_SENSOR=y
#CONFIG_BMI270=y
#CONFIG_BMP581=y

CONFIG_DISPLAY=y
#CONFIG_SDL_DISPLAY=y

CONFIG_ZSWATCH_ROUND_SCREEN=y
CONFIG_SEGMENT34_SHOW_LUNAR=y
